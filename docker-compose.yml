version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartmarket_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-smartmarket}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartmarket_secret}
      POSTGRES_DB: ${DB_NAME:-smartmarket_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-smartmarket} -d ${DB_NAME:-smartmarket_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartmarket_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
